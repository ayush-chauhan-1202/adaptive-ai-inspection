[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-ai-inspection"
version = "0.1.0"
description = "Production-oriented AI inspection platform for industrial anomaly detection"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

ml = [
    "torch>=2.3",
    "torchvision>=0.18",
]

serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "mlflow>=2.14",
    "prometheus-client>=0.20",
    "pandas>=2.2",
    "google-cloud-storage>=2.16",  # lets mlflow.pyfunc.load_model read gs:// model paths
]

mlops = [
    "evidently>=0.4",
    "dvc[gs]>=3.50",
]

test = [
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"