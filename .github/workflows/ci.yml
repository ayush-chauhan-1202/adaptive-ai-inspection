name: CI

# Runs on every PR and every push to main: lint + the full test suite. This
# is intentionally decoupled from cd.yml (the build is not blocked on
# needing GCP credentials just to check that the code is correct), and
# cd.yml itself requires this workflow to succeed first.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,serve,test,mlops]"
          pip install torch torchvision --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -v
