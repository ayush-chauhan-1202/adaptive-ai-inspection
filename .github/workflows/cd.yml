name: CD

# Deploys the API to Cloud Run on every push to main, after CI has passed.
# This workflow deploys the *application* (code + container), not the
# model: the model is a separately-promoted artifact loaded from GCS at
# container startup (see RUNBOOK.md and src/inspection/serving/registry.py).
# That split is what lets a new model get promoted without needing a new
# deploy, and a new deploy happen without retraining anything.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for keyless auth via Workload Identity Federation

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.AR_REPOSITORY }}/adaptive-ai-inspection
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.AR_REPOSITORY }}/adaptive-ai-inspection
        run: |
          gcloud run deploy adaptive-ai-inspection \
            --image "$IMAGE:${{ github.sha }}" \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "INSPECTION_MODEL_PATH=${{ secrets.PRODUCTION_MODEL_GCS_PATH }}" \
            --memory 2Gi \
            --cpu 2 \
            --max-instances 3

      - name: Show deployed URL
        run: |
          gcloud run services describe adaptive-ai-inspection \
            --region "${{ secrets.GCP_REGION }}" \
            --format "value(status.url)"
